<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="jl-title jl-desc">
  <title id="jl-title">journal-mcp — append-only journal, passports and document index for agents</title>
  <desc id="jl-desc">Header "journal-mcp" with the note "SQLite, stdio, triggers block UPDATE and DELETE". The promise "Every agent action, spec and decision in one append-only journal — so nothing drifts and context survives", the facts line "1,558 docs approximately 4.5M tokens kept out of context, 19 tools, 209 tests", a four card flow: append_record writes a record, a repeated call is deduplicated, doc_register stores a sha256 index row, doc_verify returns ok, drift or missing, and a footer: append-only by SQLite trigger; the demo ran on a temporary database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1A2C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="400" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="20" fill="none" stroke="#26324A" stroke-width="1"/>

  <!-- header -->
  <text x="56" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#E6EDF7" letter-spacing="-0.5">journal-mcp</text>
  <rect x="252" y="42" width="286" height="28" rx="14" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <text x="395" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="middle">MCP journal &#183; passports &#183; document index</text>
  <text x="1224" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="end">SQLite &#183; stdio &#183; triggers block UPDATE and DELETE</text>

  <!-- promise -->
  <text x="56" y="114" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#E6EDF7" letter-spacing="-0.3">Every agent action, spec and decision in one append-only journal &#8212;</text>
  <text x="56" y="144" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#E6EDF7" letter-spacing="-0.3">so nothing drifts and context survives</text>
  <text x="56" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9FB0C7">1,558 docs &#8776; 4.5M tokens kept out of context &#183; 19 tools &#183; 209 tests</text>

  <!-- step labels -->
  <text x="60" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">1 &#183; APPEND</text>
  <text x="366" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">2 &#183; IDEMPOTENT</text>
  <text x="672" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">3 &#183; INDEX</text>
  <text x="978" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#FBBF24" letter-spacing="1.2">4 &#183; VERIFY</text>

  <!-- cards -->
  <rect x="56" y="196" width="250" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <rect x="362" y="196" width="250" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <rect x="668" y="196" width="250" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <rect x="974" y="196" width="250" height="118" rx="12" fill="#141E31" stroke="#FBBF24" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- card 1: append -->
  <text x="74" y="226" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">append_record(...)</text>
  <text x="74" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">{&quot;id&quot;: 1, &quot;ts&quot;: &quot;&#8230;&quot;}</text>
  <text x="74" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#60A5FA">&quot;deduplicated&quot;: false</text>
  <text x="74" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">one action &#8594; one record</text>

  <!-- card 2: idempotent -->
  <text x="380" y="226" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">same call, same id</text>
  <text x="380" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">&quot;deduplicated&quot;: true</text>
  <text x="380" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#60A5FA">id 1 &#8594; 1</text>
  <text x="380" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">900 s dedup window (server.py)</text>

  <!-- card 3: index -->
  <text x="686" y="226" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">doc_register(path)</text>
  <text x="686" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">sha256 &#183; bytes &#183; lines</text>
  <text x="686" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#60A5FA">index row = metadata</text>
  <text x="686" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">body stays on disk until needed</text>

  <!-- card 4: verify -->
  <text x="992" y="226" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">doc_verify(path)</text>
  <text x="992" y="248" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6EDF7">ok &#183; drift &#183; missing</text>
  <text x="992" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FBBF24">sha256 recomputed</text>
  <text x="992" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">mismatch is reported as drift</text>

  <!-- arrows -->
  <g stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 255 H322"/>
    <path d="M316 248 L324 255 L316 262"/>
    <path d="M618 255 H628"/>
    <path d="M622 248 L630 255 L622 262"/>
    <path d="M924 255 H934"/>
    <path d="M928 248 L936 255 L928 262"/>
  </g>

  <!-- cost note -->
  <text x="56" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C3D0E2">Cost of context: all 1,558 task documents &#8776; 4,523,262 tokens; their index rows &#8776; 192,022 tokens &#8212; 95.75% never enters the window.</text>

  <!-- footer -->
  <text x="56" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7">Append-only by SQLite trigger &#8212; UPDATE and DELETE on records are refused; a repeated record returns the same id.</text>
  <text x="1224" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="end">Demo ran on a %TEMP% database &#183; live journal untouched</text>
</svg>
